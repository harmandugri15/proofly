<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hard offset shadow -->
  <rect x="8" y="8" width="48" height="48" rx="14" fill="#1F2C23" />
  
  <!-- Main squircle container -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="#FFDE59" stroke="#1F2C23" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Minimalist Chunky Letter 'P' -->
  <!-- Stem -->
  <rect x="15" y="14" width="7" height="28" rx="2" fill="#1F2C23" />
  
  <!-- Loop/Bowl of P -->
  <path d="M 22 14 L 33 14 C 38.5 14 43 18.5 43 24 C 43 29.5 38.5 34 33 34 L 22 34 Z" fill="#1F2C23" />
  
  <!-- Inner counter of P with solid contrast -->
  <path d="M 22 20.5 L 32 20.5 C 34 20.5 35.5 22 35.5 24 C 35.5 26 34 27.5 32 27.5 L 22 27.5 Z" fill="#FFDE59" />
  
  <!-- Verified Badge / Checkmark Accent -->
  <circle cx="38" cy="37" r="8" fill="#86EFAC" stroke="#1F2C23" stroke-width="3" />
  <path d="M 34.5 37 L 37 39.5 L 41.5 34.5" fill="none" stroke="#1F2C23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
