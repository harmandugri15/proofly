version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proofly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofly
      POSTGRES_PASSWORD: proofly_secret_password
      POSTGRES_DB: proofly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofly -d proofly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proofly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: proofly-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://proofly:proofly_secret_password@postgres:5432/proofly?schema=public
      JWT_SECRET: production-super-secret-jwt-key-replace-me-32bytes
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: proofly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
