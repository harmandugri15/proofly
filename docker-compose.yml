version: '3.8'

services:
  proofly:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=change-this-in-production-to-a-secure-random-32char-string
      - COOKIE_SECRET=change-this-in-production-cookie-secret
      - CORS_ORIGIN=*
    volumes:
      - proofly-db:/app/packages/backend/prisma

volumes:
  proofly-db:
